<!doctype html>
<html lang="vi" class="fs-l">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sổ Thuê Nhà — Quản lý hợp đồng cho thuê</title>
<meta name="description" content="Theo dõi hợp đồng cho thuê, tiền thuê và phí quản lý: ai đã trả, ai còn nợ, khoản nào sắp đến hạn." />
<meta name="theme-color" content="#1B1714" />
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Sổ Thuê Nhà" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7; --paper-2:#F2EEE6;
    --card:#FFFFFF;
    --yellow:#FFC400; --yellow-deep:#E5A600; --yellow-soft:#FFF1C2; --yellow-ink:#7A5800;
    --ink:#1B1714; --ink-2:#3D362F; --ink-soft:#6F685F; --line:#E6E0D4;
    --green:#4FA570; --green-soft:#E3F1E6; --green-ink:#2E6B47;
    --coral:#F2603C; --coral-soft:#FCE3DB; --coral-ink:#B23D1E;
    --surface-sunken:#FBF8F1;
    --shadow:0 14px 32px -16px rgba(26,20,12,.24);
    --shadow-sm:0 8px 20px -12px rgba(26,20,12,.18);
    --shadow-dark:0 12px 28px -12px rgba(20,16,10,.40);
    --btn-shadow:0 6px 16px -8px rgba(229,166,0,.55);
    --btn-shadow-hover:0 9px 20px -8px rgba(229,166,0,.72);
    --btn-shadow-active:0 3px 9px -6px rgba(229,166,0,.55);
    --r:24px; --r-md:18px; --r-sm:14px; --r-tab:22px; --r-pill:999px;
    --font-display:"Bricolage Grotesque",system-ui,sans-serif;
    --font-body:"Be Vietnam Pro",system-ui,sans-serif;
    --tracking-display:-0.3px;
    --ease:cubic-bezier(.4,0,.2,1);
    --dur-fast:0.12s; --dur-base:0.25s;
    --tabbar-h:78px;
  }
  /* Cỡ chữ: đổi trong Cài đặt (mọi kích thước chữ dùng rem) */
  html{font-size:18px} html.fs-m{font-size:16px} html.fs-l{font-size:18px} html.fs-xl{font-size:20.5px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body); color:var(--ink); line-height:1.5; font-size:1rem;
    background:radial-gradient(130% 90% at 50% -20%,#FFFDF6 0%,transparent 55%) var(--paper);
    background-attachment:fixed; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:600px; margin:0 auto; padding:10px 16px calc(var(--tabbar-h) + 48px + env(safe-area-inset-bottom))}
  body.unsaved .app{padding-bottom:calc(var(--tabbar-h) + 150px + env(safe-area-inset-bottom))}
  h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:var(--tracking-display); margin:0}
  button,input,select,textarea{font-family:var(--font-body); font-size:1rem; color:inherit}
  button{cursor:pointer; border:none; background:none}
  a{color:var(--coral-ink)}
  :focus-visible{outline:3px solid var(--coral); outline-offset:2px; border-radius:6px}
  .hidden{display:none !important}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* Topbar */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 4px}
  .brand{display:flex; align-items:center; gap:9px; min-width:0; overflow:hidden}
  .brand .logo{width:38px; height:38px; display:block; flex:none}
  .brand .name{font-family:var(--font-display); font-weight:800; font-size:min(1.35rem, 6vw); letter-spacing:var(--tracking-display); white-space:nowrap}
  .brand .name b{color:var(--yellow-deep)}
  .btn-top{display:inline-flex; align-items:center; gap:7px; min-height:48px; padding:8px 16px; border-radius:var(--r-pill); background:var(--card); border:2px solid var(--line); font-weight:700; font-size:min(.92rem, 4.2vw); white-space:nowrap; flex:none}
  .btn-top:hover{border-color:var(--ink)}
  .btn-top.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .save-line{display:flex; justify-content:flex-end; align-items:center; gap:6px; font-size:.8rem; color:var(--ink-soft); min-height:1.4em; margin-bottom:6px}
  .save-line.dirty{color:var(--coral-ink); font-weight:700}

  /* Cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:20px}
  .card + .card, .card + .block, .block + .card{margin-top:14px}
  .card-dark{background:var(--ink); border-color:var(--ink); color:#fff}
  .card-soft{background:var(--surface-sunken); box-shadow:none}
  .eyebrow{font-weight:700; font-size:.78rem; letter-spacing:1.4px; text-transform:uppercase; color:var(--yellow-ink)}
  .card-dark .eyebrow{color:var(--yellow)}
  .block{margin-top:14px}
  .sec-title{display:flex; align-items:center; gap:9px; margin:24px 2px 10px; color:var(--ink-soft)}
  .sec-title h3{font-size:1.15rem; font-weight:700; color:var(--ink)}
  .sec-title .m-line{flex:1; height:1px; background:var(--line)}
  .muted{color:var(--ink-soft)}

  /* Buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:1rem; border-radius:var(--r-pill); padding:12px 20px; min-height:56px; transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),background var(--dur-base) var(--ease),filter var(--dur-fast) var(--ease); white-space:nowrap; border:none; cursor:pointer; text-decoration:none; color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--yellow); color:var(--ink); box-shadow:var(--btn-shadow)}
  .btn-primary:hover{background:var(--yellow-deep); box-shadow:var(--btn-shadow-hover)}
  .btn-primary:active{box-shadow:var(--btn-shadow-active)}
  .btn-dark{background:var(--ink); color:#fff}
  .btn-dark:hover{filter:brightness(1.35)}
  .btn-ghost{background:var(--yellow-soft); color:var(--yellow-ink)}
  .btn-soft{background:var(--green-soft); color:var(--green-ink)}
  .btn-soft:hover{background:#D4EAD8}
  .btn-line{background:var(--card); border:2px solid var(--line); color:var(--ink)}
  .btn-line:hover{border-color:var(--ink)}
  .btn-danger{background:var(--card); border:2px solid var(--coral-soft); color:var(--coral-ink)}
  .btn-danger:hover{border-color:var(--coral)}
  .btn-block{display:flex; width:100%}
  .btn-lg{font-size:1.08rem; min-height:62px; padding:14px 24px}
  .btn-sm{min-height:46px; padding:8px 16px; font-size:.92rem}
  .btn-row{display:flex; gap:10px; margin-top:14px}
  .btn-row .btn{flex:1}
  .btn[disabled]{opacity:.5; cursor:not-allowed}

  /* Greet */
  .greet{margin:6px 2px 14px}
  .greet h2{font-size:1.7rem; font-weight:800; line-height:1.15}
  .greet .sub{color:var(--ink-soft); font-size:.92rem; margin-top:4px; line-height:1.45}
  .back{display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:6px 14px 6px 8px; margin:0 0 6px -4px; border-radius:var(--r-pill); font-weight:700; color:var(--ink)}
  .back:hover{background:var(--paper-2)}

  /* Month switcher */
  .month-nav{display:flex; align-items:center; gap:10px; padding:10px}
  .month-nav .arrow{width:58px; height:58px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--yellow-soft); color:var(--yellow-ink)}
  .month-nav .arrow:hover{background:var(--yellow)}
  .month-nav .mid{flex:1; text-align:center; min-width:0}
  .month-nav .mid .lbl{font-size:.8rem; color:var(--ink-soft); font-weight:600}
  .month-nav .mid .val{font-family:var(--font-display); font-weight:800; font-size:min(1.45rem, 6.2vw); line-height:1.15; white-space:nowrap}
  .month-nav .mid .today-link{font-size:.82rem; font-weight:700; color:var(--coral-ink); text-decoration:underline; padding:2px 6px; min-height:auto}

  /* Big numbers + progress */
  .big-num{font-family:var(--font-display); font-weight:800; font-size:min(2.15rem, 9.4vw); line-height:1.1; letter-spacing:-.5px; margin:6px 0 2px; white-space:nowrap}
  .card-dark .big-num{color:var(--yellow)}
  .big-cap{font-size:.92rem; color:var(--ink-soft)}
  .card-dark .big-cap{color:rgba(255,255,255,.72)}
  .bar{height:14px; border-radius:var(--r-pill); background:var(--paper-2); overflow:hidden; margin:14px 0 6px}
  .card-dark .bar{background:rgba(255,255,255,.16)}
  .bar i{display:block; height:100%; background:var(--green); border-radius:var(--r-pill); transition:width .4s var(--ease)}
  .bar-cap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px 12px; font-size:.82rem; color:var(--ink-soft)}
  .card-dark .bar-cap{color:rgba(255,255,255,.7)}

  /* Key–value rows */
  .kv{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:.98rem}
  .kv:first-child{border-top:none}
  .card-dark .kv{border-color:rgba(255,255,255,.14)}
  .kv .k{color:var(--ink-soft)}
  .card-dark .kv .k{color:rgba(255,255,255,.72)}
  .kv .k{min-width:0; flex:1 1 auto}
  .kv .v{font-weight:700; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .kv .v.red{color:var(--coral-ink)} .card-dark .kv .v.red{color:#FF9A80}
  .kv .v.green{color:var(--green-ink)} .card-dark .kv .v.green{color:#8FD6A6}
  .kvs{margin-top:10px}

  /* Badges */
  .badge{display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:.85rem; padding:5px 12px; border-radius:var(--r-pill); white-space:nowrap}
  .b-late{background:var(--coral-soft); color:var(--coral-ink)}
  .b-soon{background:var(--yellow-soft); color:var(--yellow-ink)}
  .b-wait{background:var(--paper-2); color:var(--ink-2)}
  .b-done{background:var(--green-soft); color:var(--green-ink)}
  .b-dark{background:var(--ink); color:#fff}

  /* Debt summary */
  .debt-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px}
  .debt-box{border-radius:var(--r-md); padding:14px; background:var(--coral-soft)}
  .debt-box.fee{background:var(--yellow-soft)}
  .debt-box .t{font-size:.95rem; font-weight:700; color:var(--ink-2); line-height:1.3}
  .debt-box .n{font-family:var(--font-display); font-weight:800; font-size:min(1.7rem, 8vw); line-height:1.15; margin-top:4px; white-space:nowrap}
  .debt-box .c{font-size:.88rem; color:var(--ink-2); margin-top:2px}

  /* List of people who owe */
  .owe{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:14px; margin-bottom:10px; box-shadow:inset 6px 0 0 var(--coral), var(--shadow-sm)}
  .owe:hover{border-color:var(--ink)}
  .owe .info{flex:1; min-width:0}
  .owe .nm{font-family:var(--font-display); font-weight:700; font-size:1.12rem; line-height:1.2}
  .owe .meta{font-size:.85rem; color:var(--ink-soft); margin-top:2px}
  .owe .amt{font-weight:800; color:var(--coral-ink); font-size:1.02rem; margin-top:4px}
  .owe .go{flex:none; display:inline-flex; align-items:center; gap:4px; font-weight:700; font-size:.88rem; color:var(--ink); background:var(--paper-2); border-radius:var(--r-pill); padding:10px 12px}

  /* Segmented control + filter chips */
  .seg{display:flex; background:var(--paper-2); border-radius:var(--r-pill); padding:5px; gap:5px; margin-bottom:12px}
  .seg button{flex:1; min-height:50px; border-radius:var(--r-pill); font-weight:700; font-size:.95rem; color:var(--ink-2)}
  .seg button.on{background:var(--ink); color:#fff; box-shadow:var(--shadow-sm)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px}
  .chip{border:2px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:8px 14px; min-height:46px; font-size:.92rem; font-weight:600; display:inline-flex; align-items:center; gap:6px}
  .chip:hover{border-color:var(--ink)}
  .chip.sel{background:var(--yellow); border-color:var(--yellow)}
  .chip .n{font-size:.8rem; background:rgba(0,0,0,.08); border-radius:var(--r-pill); padding:1px 8px}

  /* Ledger row card */
  .row{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:16px 16px 14px 20px; margin-top:12px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden}
  .row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:7px; background:var(--line)}
  .row.s-late::before{background:var(--coral)} .row.s-soon::before{background:var(--yellow)} .row.s-done::before{background:var(--green)}
  .row .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap}
  .row .per{font-size:.85rem; font-weight:700; color:var(--ink-soft)}
  .row .nm{font-family:var(--font-display); font-weight:700; font-size:1.22rem; line-height:1.2; margin-top:8px}
  .row .meta{font-size:.88rem; color:var(--ink-soft); margin-top:2px}
  .row .kvs{margin-top:8px}
  .row .note{background:var(--yellow-soft); color:var(--yellow-ink); border-radius:12px; padding:9px 12px; font-size:.88rem; margin-top:10px}
  .row .btn-row{margin-top:12px}
  .row.flash{animation:agd-pop .45s var(--ease)}

  /* Compact row (contract detail) */
  .mini-row{display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line)}
  .mini-row:first-child{border-top:none}
  .mini-row .l{flex:1; min-width:0}
  .mini-row .p{font-weight:700}
  .mini-row .s{font-size:.85rem; color:var(--ink-soft)}
  .mini-row .acts{display:flex; gap:6px; flex:none}
  .mini-row .acts .btn{min-height:46px; padding:6px 12px; font-size:.88rem}

  /* Contract cards */
  .contract{cursor:pointer}
  .contract .head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .contract .code{font-size:.8rem; font-weight:700; color:var(--ink-soft); letter-spacing:.5px}
  .contract .nm{font-family:var(--font-display); font-weight:700; font-size:1.25rem; line-height:1.2; margin-top:2px}
  .contract .addr{font-size:.92rem; color:var(--ink-soft); margin-top:2px}
  .contract:hover{border-color:var(--ink)}

  /* Empty state + banners */
  .empty{text-align:center; color:var(--ink-soft); padding:30px 16px}
  .empty .ic{width:64px; height:64px; border-radius:20px; margin:0 auto 12px; background:var(--green-soft); color:var(--green-ink); display:grid; place-items:center}
  .banner{display:flex; gap:12px; align-items:flex-start; background:var(--yellow-soft); color:var(--yellow-ink); border-radius:var(--r-md); padding:14px; margin-top:12px; font-size:.95rem}
  .banner .btn{margin-top:10px}
  .legend{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; font-size:.88rem}
  .legend div{display:flex; align-items:center; gap:6px}

  /* Settings */
  .set-block h4{font-size:1.1rem; font-weight:700; margin-bottom:4px}
  .set-block p{font-size:.9rem; color:var(--ink-soft); margin:0 0 10px}
  hr.sep{border:none; border-top:1px solid var(--line); margin:20px 0}
  .steps{margin:0; padding-left:1.3em} .steps li{margin-bottom:8px}

  /* Forms */
  .field{margin-top:14px}
  .field label, .field .lab{display:block; font-weight:700; font-size:.95rem; margin-bottom:6px}
  .field .hint{font-size:.82rem; color:var(--ink-soft); margin-top:4px}
  .input{width:100%; border:2px solid var(--line); border-radius:var(--r-sm); padding:12px 14px; min-height:56px; font-size:1.08rem; background:var(--surface-sunken); color:var(--ink); transition:border-color .15s}
  .input:focus{outline:none; border-color:var(--ink)}
  textarea.input{min-height:84px; resize:vertical; line-height:1.4}
  .input.money{font-weight:700; font-size:1.25rem; font-variant-numeric:tabular-nums}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:420px){ .grid2{grid-template-columns:1fr} }
  details.more{margin-top:16px; border-top:1px solid var(--line); padding-top:6px}
  details.more summary{cursor:pointer; font-weight:700; min-height:48px; display:flex; align-items:center; color:var(--ink-2)}

  /* Bottom sheet (dialog) */
  dialog.sheet{border:none; padding:0; margin:auto auto 0; width:100%; max-width:600px; max-height:92dvh; border-radius:26px 26px 0 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow-dark)}
  dialog.sheet::backdrop{background:rgba(27,23,20,.5)}
  dialog.sheet[open]{animation:sheet-up .25s var(--ease)}
  @media (min-width:640px){ dialog.sheet{margin:auto; border-radius:26px} }
  .sheet-in{padding:18px 20px calc(20px + env(safe-area-inset-bottom)); overflow:auto; max-height:92dvh}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .sheet-head h3{font-size:1.35rem; font-weight:800; line-height:1.2}
  .sheet-head .sub{font-size:.92rem; color:var(--ink-soft); margin-top:4px}
  .x-btn{flex:none; min-height:48px; padding:6px 14px; border-radius:var(--r-pill); background:var(--paper-2); font-weight:700; font-size:.9rem}
  .quick{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:2px solid var(--line); border-radius:var(--r-md); padding:14px; margin-top:10px; background:var(--card)}
  .opt:hover{border-color:var(--ink)}
  .opt .ic{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; background:var(--yellow-soft); color:var(--yellow-ink); flex:none}
  .opt .t{font-weight:700; font-size:1.02rem}
  .opt .d{font-size:.85rem; color:var(--ink-soft)}

  /* Save bar */
  .savebar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + var(--tabbar-h) + 10px + env(safe-area-inset-bottom)); width:calc(100% - 32px); max-width:568px; z-index:45;
    background:var(--yellow); color:var(--ink); border-radius:var(--r-md); box-shadow:var(--shadow-dark); display:flex; align-items:center; gap:12px; padding:10px 10px 10px 16px}
  .savebar .txt{flex:1; min-width:0; line-height:1.3}
  .savebar .txt b{display:block; font-size:1rem}
  .savebar .txt span{font-size:.82rem; color:var(--ink-2)}
  .savebar .btn{min-height:54px; flex:none}

  /* Tab bar */
  .tabbar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); width:calc(100% - 32px); max-width:568px;
    background:var(--ink); border:1px solid var(--ink); border-radius:var(--r-tab); box-shadow:var(--shadow-dark); display:flex; padding:7px; gap:4px; z-index:40}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:62px; padding:6px 2px; border-radius:15px; font-size:clamp(13px,.74rem,14px); white-space:nowrap; font-weight:700; color:#B5AEA4; transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease); line-height:1.15; text-align:center}
  .tab .ti{display:grid; place-items:center; height:24px}
  .tab.active{color:var(--ink); background:var(--yellow)}
  .tab:not(.active):hover{background:rgba(255,255,255,.08); color:#fff}

  /* Toast */
  .toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translateX(-50%) translateY(-20px); background:var(--ink); color:#fff; padding:12px 12px 12px 20px; border-radius:var(--r-md); font-size:.98rem; font-weight:600; line-height:1.35; opacity:0; pointer-events:none; transition:.25s; box-shadow:var(--shadow-dark); z-index:60; display:flex; align-items:center; gap:12px; width:max-content; max-width:min(568px, calc(100% - 32px))}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto}
  .toast button{background:var(--yellow); color:var(--ink); border-radius:var(--r-pill); padding:8px 14px; font-weight:700; min-height:42px; white-space:nowrap}
  .footer{text-align:center; color:var(--ink-soft); font-size:.8rem; margin-top:22px; line-height:1.6}

  @keyframes agd-pop{0%{transform:scale(.97);opacity:.5}100%{transform:scale(1);opacity:1}}
  @keyframes sheet-up{0%{transform:translateY(40px);opacity:.4}100%{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  /* In (dự phòng khi không tải được thư viện PDF) */
  @media print{
    body{background:#fff}
    .tabbar,.savebar,.toast,.topbar .btn-top,.save-line,.btn,.btn-row,.chips,.seg,.month-nav .arrow,.back,.today-link{display:none !important}
    .app{max-width:none; padding:0}
    .card,.row,.owe{box-shadow:none; break-inside:avoid}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" fill="none" role="img" aria-label="Sổ Thuê Nhà">
        <path d="M44.5 9.5 q-3 3 0 6" stroke="#4FA570" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M9 31 L32 12.5 L55 31" stroke="#FFC400" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="55.5" cy="38" r="2.8" fill="#F2603C"/>
        <path d="M16 31.5 h32 v15.5 a7 7 0 0 1 -7 7 h-18 a7 7 0 0 1 -7 -7 Z" fill="#1B1714"/>
        <rect x="27.5" y="39" width="9" height="15.5" rx="2.5" fill="#FFC400"/>
        <circle cx="34" cy="47" r="1.3" fill="#1B1714"/>
      </svg>
      <span class="name">Sổ Thuê <b>Nhà</b></span>
    </div>
    <button class="btn-top" id="btn-settings" onclick="go('settings')"><span id="ti-set"></span>Cài đặt</button>
  </header>
  <div class="save-line" id="save-line" aria-live="polite"></div>

  <!-- TỔNG QUAN -->
  <section id="screen-home" class="hidden" aria-labelledby="h-home"></section>
  <!-- THU TIỀN THUÊ -->
  <section id="screen-rent" class="hidden"></section>
  <!-- PHÍ QUẢN LÝ -->
  <section id="screen-fee" class="hidden"></section>
  <!-- HỢP ĐỒNG -->
  <section id="screen-contracts" class="hidden"></section>
  <!-- TIẾN ĐỘ MỘT HỢP ĐỒNG -->
  <section id="screen-contract" class="hidden"></section>
  <!-- CÀI ĐẶT -->
  <section id="screen-settings" class="hidden"></section>

  <p class="footer">Dữ liệu được lưu trên máy này. Nhớ bấm “Sao lưu” trong Cài đặt thỉnh thoảng nhé.</p>
</div>

<!-- Thanh lưu: hiện khi có thay đổi chưa lưu -->
<div class="savebar hidden" id="savebar" role="status" aria-live="polite">
  <div class="txt"><b id="savebar-title">Có thay đổi chưa lưu</b><span id="savebar-sub">Tự động lưu sau 60 giây</span></div>
  <button class="btn btn-dark" id="savebar-btn" onclick="saveNow(false)"></button>
</div>

<!-- Thanh tab -->
<nav class="tabbar" id="tabbar" aria-label="Các mục chính">
  <button class="tab" data-tab="home" onclick="go('home')"><span class="ti" id="ti-home"></span>Tổng quan</button>
  <button class="tab" data-tab="rent" onclick="go('rent')"><span class="ti" id="ti-rent"></span>Tiền thuê</button>
  <button class="tab" data-tab="fee" onclick="go('fee')"><span class="ti" id="ti-fee"></span>Phí quản lý</button>
  <button class="tab" data-tab="contracts" onclick="go('contracts')"><span class="ti" id="ti-contracts"></span>Hợp đồng</button>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-in" id="sheet-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-act" class="hidden"></button></div>
<input type="file" id="file-restore" accept="application/json,.json" class="hidden" />

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script src="js/pdf.js"></script>
</body>
</html>
